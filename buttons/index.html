<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons — Esther Hong</title>
    <link rel="stylesheet" href="https://use.typekit.net/utp8dhx.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Button Styling — Esther Hong</h1>

    <main>
        <div class="button_container">
            <a href="https://www.spotify.com/" target="_blank" class="button" id="btn_spotify">Spotify</a>
        </div>

        <div class="button_container">
            <a href="https://www.amazon.com/" target="_blank" class="button" id="btn_amazon">a</a>
        </div>

        <div class="button_container">
            <a href="https://www.twitter.com/" target="_blank" class="button" id="btn_twitter">twitter</a>
        </div>

        <div class="button_container">
            <a href="https://www.indiegogo.com/" target="_blank" class="button" id="btn_indiegogo">indiegogo</a>
        </div>

        <div class="button_container">
            <a href="https://www.apple.com/" target="_blank" class="button" id="btn_apple">Apple</a>
        </div>

        <div class="button_container">
            <a href="https://www.nike.com/us/en_us/" target="_blank" class="button" id="btn_nike">NIKE</a>
        </div>

        <div class="button_container">
            <a href="https://www.lyft.com/" target="_blank" class="button" id="btn_lyft">
                <span class="car">🚗</span>
                <span>Lyft</span>
            </a>
        </div>

        <div class="button_container">
            <a href="https://www.oldnavy.com/" target="_blank" class="button" id="btn_oldnavy">OLD NAVY</a>
        </div>

        <div class="button_container">
            <a href="https://www.npr.org/" target="_blank" class="button" id="btn_npr">
                <span class="npr-box npr-n">n</span><span class="npr-box npr-p">p</span><span class="npr-box npr-r">r</span>
            </a>
        </div>
    </main>

</body>
</html>
